# Requires: ingress-nginx controller + cert-manager installed in the cluster.
# Replace devapp.example.com with your real domain.

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: devapp-tls
  namespace: devapp
spec:
  secretName: devapp-tls-secret
  issuerRef:
    name: letsencrypt-prod      # ClusterIssuer configured with your email
    kind: ClusterIssuer
  dnsNames:
    - app.devapp.example.com    # frontend
    - api.devapp.example.com    # backend (for direct API access / webhooks)
    - auth.devapp.example.com   # Keycloak OIDC endpoints

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devapp-ingress
  namespace: devapp
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # Rate limiting for webhook endpoint (30 req/min)
    nginx.ingress.kubernetes.io/limit-rps: "0.5"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
spec:
  tls:
    - hosts:
        - app.devapp.example.com
        - api.devapp.example.com
        - auth.devapp.example.com
      secretName: devapp-tls-secret
  rules:
    - host: app.devapp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: api.devapp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 9090
    - host: auth.devapp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
