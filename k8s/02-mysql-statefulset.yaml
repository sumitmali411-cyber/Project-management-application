---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: devapp
data:
  my.cnf: |
    [mysqld]
    character-set-server  = utf8mb4
    collation-server      = utf8mb4_unicode_ci
    max_connections       = 300
    innodb_buffer_pool_size = 256M

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: devapp
spec:
  serviceName: mysql
  replicas: 1          # MySQL is single-primary; scale reads via read replicas, not replicas here
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999       # mysql user in the official image
        fsGroup: 999
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
            - name: MYSQL_DATABASE
              value: devapp
            - name: MYSQL_USER
              value: devapp
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: devapp-password
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-config
              mountPath: /etc/mysql/conf.d
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$(MYSQL_ROOT_PASSWORD)"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["mysql", "-h", "localhost", "-u", "devapp", "-p$(MYSQL_PASSWORD)", "-e", "SELECT 1"]
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: mysql-config
          configMap:
            name: mysql-config
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
        # storageClassName: gp3   # uncomment on AWS EKS; use standard on GKE/AKS

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: devapp
spec:
  clusterIP: None       # headless — StatefulSet pods get stable DNS: mysql-0.mysql.devapp.svc.cluster.local
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
