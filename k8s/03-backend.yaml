---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: devapp
data:
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-0.mysql.devapp.svc.cluster.local:3306/devapp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
  MYSQL_USER: devapp
  MYSQL_ROOT_USER: root
  CORS_ALLOWED_ORIGINS: "https://app.devapp.example.com"
  # Replace with your real domain ^^^
  # Keycloak issuer URI — uses K8s internal DNS (keycloak Service in devapp namespace)
  KEYCLOAK_ISSUER_URI: "http://keycloak.devapp.svc.cluster.local:8080/realms/devsync"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devapp
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0     # zero-downtime deploys
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        readOnlyRootFilesystem: true
      containers:
        - name: backend
          image: ghcr.io/YOUR_ORG/devapp-backend:latest   # replace with your registry
          ports:
            - containerPort: 9090
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: devapp-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: jwt-secret
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: github-webhook-secret
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9090
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp     # needed for spring temp files when readOnlyRootFilesystem=true
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: devapp
spec:
  selector:
    app: backend
  ports:
    - port: 9090
      targetPort: 9090

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: devapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
