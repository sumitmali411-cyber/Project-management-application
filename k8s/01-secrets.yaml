# IMPORTANT: Do NOT commit real secrets here.
# Replace every <base64-encoded-...> placeholder with:
#   echo -n 'your-actual-value' | base64
# Or use sealed-secrets / external-secrets in production.

---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: devapp
type: Opaque
data:
  root-password: <base64-encoded-root-password>
  devapp-password: <base64-encoded-devapp-password>

---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: devapp
type: Opaque
data:
  jwt-secret: <base64-encoded-jwt-secret-min-32-chars>
  github-webhook-secret: <base64-encoded-github-webhook-secret>
