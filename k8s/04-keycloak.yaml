# Keycloak 24 — Identity & Access Management
# Namespace: devapp (DevSync)
# Internal DNS: keycloak.devapp.svc.cluster.local:8080
# Realm: devsync  (import via Job after first boot — see bottom of this file)
# This mirrors JIRA-Clone's 04-keycloak.yaml but for the devapp namespace/realm.
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: devapp
  labels:
    app: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: devapp
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      automountServiceAccountToken: false
      initContainers:
        # Wait for MySQL to be ready before Keycloak starts
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql-0.mysql.devapp.svc.cluster.local 3306; do
                echo "Waiting for MySQL..."; sleep 3
              done
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0
          args:
            - start-dev
            - --db=mysql
            - --db-url=jdbc:mysql://mysql-0.mysql.devapp.svc.cluster.local:3306/keycloak?createDatabaseIfNotExist=true
            - --db-username=root
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: admin-password
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
            - name: JAVA_OPTS_APPEND
              value: "-Xms128m -Xmx512m"
          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

---
# Optional: expose Keycloak externally via ingress at auth.devapp.example.com
# (See 05-ingress.yaml for the full ingress with this added)
# kubectl port-forward svc/keycloak 8180:8080 -n devapp   # quick local access

---
# Realm import Job — runs once after Keycloak is up to create the "devsync" realm.
# The realm JSON is mounted from a ConfigMap (create it separately):
#   kubectl create configmap devsync-realm --from-file=devsync-realm.json \
#     -n devapp --dry-run=client -o yaml | kubectl apply -f -
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-import
  namespace: devapp
  annotations:
    # Re-run manually: kubectl delete job keycloak-realm-import -n devapp && kubectl apply -f 04-keycloak.yaml
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-keycloak
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://keycloak:8080/realms/master > /dev/null 2>&1; do
                echo "Waiting for Keycloak..."; sleep 5
              done
      containers:
        - name: realm-importer
          image: quay.io/keycloak/keycloak:24.0
          command:
            - sh
            - -c
            - |
              /opt/keycloak/bin/kcadm.sh config credentials \
                --server http://keycloak:8080 \
                --realm master \
                --user admin \
                --password "$KEYCLOAK_ADMIN_PASSWORD"
              /opt/keycloak/bin/kcadm.sh create realms \
                -f /realm/devsync-realm.json || echo "Realm may already exist — skipped"
          env:
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: admin-password
          volumeMounts:
            - name: realm-config
              mountPath: /realm
      volumes:
        - name: realm-config
          configMap:
            name: devsync-realm
